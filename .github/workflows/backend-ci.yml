name: Backend + Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 / Node 22 / PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: auneron_test
          POSTGRES_USER: auneron
          POSTGRES_PASSWORD: auneron_ci_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U auneron -d auneron_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://auneron:auneron_ci_password@localhost:5432/auneron_test
      TEST_DATABASE_URL: postgresql+psycopg://auneron:auneron_ci_password@localhost:5432/auneron_test
      API_KEY: auneron-ci-test-key-0000000000000000
      TEST_API_KEY: auneron-ci-test-key-0000000000000000
      LOG_LEVEL: INFO
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_POOL_TIMEOUT: "10"
      DATABASE_POOL_RECYCLE: "900"
      DATABASE_CONNECT_TIMEOUT: "5"
      DATABASE_STATEMENT_TIMEOUT_MS: "30000"
      DATABASE_LOCK_TIMEOUT_MS: "5000"
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: "60000"
      DATABASE_APPLICATION_NAME: auneron-api-ci
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependências do backend
        run: python -m pip install -r requirements-dev.txt

      - name: Validar dependências Python
        run: python -m pip check

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Validar lint do frontend
        working-directory: frontend
        run: npm run lint

      - name: Validar build do frontend
        working-directory: frontend
        run: npm run build

      - name: Validar isolamento do banco
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import text

          from app.database.database import engine


          app_environment = os.environ.get("APP_ENV")
          configured_database = engine.url.database

          assert app_environment == "test", (
              "APP_ENV precisa ser test. "
              f"Valor recebido: {app_environment!r}"
          )

          assert configured_database == "auneron_test", (
              "Banco inseguro configurado para o CI: "
              f"{configured_database!r}"
          )

          assert configured_database != "auneron"

          with engine.connect() as connection:
              connected_database = connection.execute(
                  text("SELECT current_database()")
              ).scalar_one()

          assert connected_database == "auneron_test", (
              "Conexão aberta no banco incorreto: "
              f"{connected_database!r}"
          )

          print(
              "Isolamento confirmado:",
              connected_database,
          )
          PY

      - name: Verificar compilação
        run: python -m compileall -q app tests scripts

      - name: Aplicar migrações
        run: python -m alembic upgrade head

      - name: Verificar revisão Alembic
        run: |
          python -m alembic current
          python -m alembic heads
          python -m alembic check

      - name: Executar testes
        run: python -m pytest --maxfail=1

      - name: Diagnóstico operacional do banco
        run: python scripts/db_diagnostics.py

      - name: Instalar Chromium do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Executar E2E frontend
        run: python scripts/e2e_frontend.py

      - name: Confirmar limpeza do banco
        run: |
          python - <<'PY'
          from sqlalchemy import text

          from app.database.database import engine


          with engine.connect() as connection:
              result = connection.execute(
                  text(
                      """
                      SELECT
                          (SELECT COUNT(*) FROM accounts)
                              AS accounts,
                          (SELECT COUNT(*) FROM knowledge)
                              AS knowledge
                      """
                  )
              ).mappings().one()

          assert result["accounts"] == 0, result
          assert result["knowledge"] == 0, result

          print(
              "Banco de testes limpo:",
              dict(result),
          )
          PY
