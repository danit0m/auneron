# SIM-1.2 -- gramatica LOCAL de nomes ficticios (nunca IA, nunca nomes
# reais de pessoas). Nome = marcador + tipo do segmento + nucleo +
# qualificador. O par (nucleo, qualificador) e escolhido por um mapeamento
# deterministico e injetivo do indice do cliente (unico enquanto
# indice < len(cores) * len(qualifiers)).

