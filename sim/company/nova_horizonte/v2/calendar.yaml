# SIM-1.3 -- calendario NORMATIVO e FICTICIO da Nova Horizonte (v2).
# Mesmas datas da v1 (nao reproduz o calendario bancario brasileiro real);
# muda so a agenda intradiaria (corredores governados reais).
# Dn = D0 + n, n em [0, 179]; 180 dias = D0 + 179 avancos.

schema: sim.calendar.v2
normative_notice: >-
  Calendario normativo e ficticio da Nova Horizonte. Nao reproduz o
  calendario bancario brasileiro real de 2026.
d0: "2026-01-05"
days: 180
timezone_name: America/Sao_Paulo
utc_offset_minutes: -180
business_weekdays: [0, 1, 2, 3, 4]
non_business_days: [42, 43, 88, 106, 116, 150]
intraday:
  clock: "07:00"
  billing_1: "09:00"
  settlement_bank_return: "10:00"   # conciliacao (mundo) + request mark_paid
  renegotiation: "10:30"
  collections_1: "11:00"            # coordenador: NBA + escalonamento
  assessments_1: "11:15"            # cobranca: contatos
  mark_paid_decide_1: "11:30"
  mark_paid_execute_1: "12:00"
  mark_overdue_materialize: "13:30"
  approvals: "14:00"                # coordenador decide mark_overdue
  mark_overdue_execute: "14:15"
  collections_2: "14:30"
  assessments_2: "14:45"
  billing_2: "15:00"
  settlement_day: "16:00"           # conciliacao PIX/TED + request mark_paid
  mark_paid_decide_2: "16:30"
  mark_paid_execute_2: "17:00"
  snapshot: "18:00"
special:
  restart_backend: {day: 90, at: "11:00"}
  stress_week: {from_day: 120, to_day: 126}
  evidence_floor: {day: 14, at: "08:00"}
seasonal_due_windows:
  - [79, 95]
  - [171, 179]
