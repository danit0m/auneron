# SIM-1.3 -- catalogo de casos da v2 (Design Freeze V1, secao 8).
# Casos v1 mantidos e reinterpretados pelos corredores reais; novos casos
# C-RACE-1, C-AUTH-1, C-AUTH-2 e C-DEAD-1 sao EXPLICITOS e deterministicos.
# origin: natural | injected | agenda | runtime (injecao deterministica
# decidida durante a simulacao).

schema: sim.cases.v2
cases:
  C-N-1: {category: normal, origin: natural, title: Pagamento pontual}
